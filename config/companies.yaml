# Companies for Memory Signals. CIKs / DART corp codes are looked up at runtime —
# never hardcode them here.
#
# forms: optional override of which EDGAR forms to fetch for this company.
# Default (when omitted) is 10-K, 10-Q, 8-K (filtered items). SK hynix also gets 6-K.
companies:
  - name: Micron
    role: supplier
    source: EDGAR
    ticker: MU

  - name: SK hynix
    role: supplier
    source: EDGAR
    ticker: SKHY
    krx_code: "000660"
    forms:
      - 10-K
      - 10-Q
      - 8-K
      - 6-K

  # Korean filings via OpenDART (Milestone 5). Cached under data/raw/000660/.
  - name: SK hynix
    role: supplier
    source: DART
    ticker: "000660"
    krx_code: "000660"

  - name: Samsung Electronics
    role: supplier
    source: DART
    ticker: "005930"
    krx_code: "005930"

  # English IR PDFs (hand list in config/ir_documents.yaml); ticker matches DART cache root.
  - name: Samsung Electronics
    role: supplier
    source: IR
