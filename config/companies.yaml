# Companies for Memory Signals. CIKs / DART corp codes are looked up at runtime —
# never hardcode them here.
#
# tier: 1 = primary graph (household / core); 2 = F500–F1000 electronics/DC;
#       3 = smaller listed / broker-dense. See config/tiers.yaml.
# forms: optional override of which EDGAR forms to fetch for this company.
# Default (when omitted) is 10-K, 10-Q, 8-K (filtered items). SK hynix also gets 6-K.

