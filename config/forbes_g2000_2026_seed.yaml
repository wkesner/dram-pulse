# Forbes Global 2000 (2026) → EDGAR seed log for EC Signals.
#
# Source: Forbes Global 2000 2026 list (edited Andrea Murphy & John Hyatt;
# published on forbes.com/lists/global2000/). Machine-readable mirror used for
# industry/country/rank fields:
#   https://download.macrofocus.com/treemap/Forbes%20Global%202000%20-%202026.csv
#   (Last-Modified: 2026-09-27; 2000 rows).
#
# Scope: semiconductors, technology hardware & equipment, plus selective
# capital-goods / IT rows that are electronics instruments, EMS/distribution,
# security appliances, or photonics — not pure SaaS, carriers, or EV OEMs.
# Tickers resolved only when present in SEC company_tickers.json (no invented
# tickers). Non-US Forbes rows skipped (JP/UK/TW/CN/etc. handled elsewhere).
# Household names stay Tier 1 only if already on that pattern; new rows are
# Tier 2 or 3.

